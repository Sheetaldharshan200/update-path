# SonarQube / SonarCloud analysis of the kit. The CI (quality.yml) feeds the
# coverage and test reports that tools/run_tests.py writes; run locally with
#   sonar-scanner -Dsonar.host.url=... -Dsonar.token=...
sonar.projectKey=exasol-personal-local-starter-kit
sonar.projectName=Exasol Personal Local Starter Kit
sonar.projectVersion=0.3.0
sonar.sourceEncoding=UTF-8

sonar.sources=exakit,mcp,bootstrap,install.sh,install.ps1,tools
sonar.tests=tests,mcp/tests
sonar.exclusions=mcp/tests/**,static/**,test_data/**,quickstarts/**,shim/**,**/__pycache__/**
sonar.test.inclusions=tests/**,mcp/tests/**

sonar.python.version=3.11,3.12
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/junit-*.xml
sonar.python.ruff.reportPaths=reports/lint.json

# What the kit accepts by decision (see ruff.toml for the same list with reasons):
# the exit-code exception names (S101 naming), imports inside functions, SQL
# built from validated identifiers. Everything else is fixed, not excluded.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S101
sonar.issue.ignore.multicriteria.e1.resourceKey=exakit/domain/errors.py
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=mcp/validator/service.py
